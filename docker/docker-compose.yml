version: '3.8'

services:
  # PostgreSQL with PostGIS and TimescaleDB
  postgres:
    image: timescale/timescaledb:latest-pg16
    container_name: smart-farm-postgres
    environment:
      POSTGRES_DB: smart_farm
      POSTGRES_USER: smart_farm
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smart_farm_dev}
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts:/docker-entrypoint-initdb.d
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smart_farm -d smart_farm"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Redis for caching, sessions, and Celery broker
  redis:
    image: redis:7-alpine
    container_name: smart-farm-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # MinIO for S3-compatible object storage
  minio:
    image: minio/minio:latest
    container_name: smart-farm-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-smartfarm}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-smartfarm123}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3

  # Backend API (Node.js/Express)
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart-farm-backend
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://smart_farm:smart_farm_dev@postgres:5432/smart_farm?schema=public
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      INTELLIGENCE_URL: http://intelligence:8001
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-smartfarm}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-smartfarm123}
      MINIO_BUCKET: smart-farm-images
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Intelligence Services (Python/FastAPI)
  intelligence:
    build:
      context: ../intelligence
      dockerfile: Dockerfile
    container_name: smart-farm-intelligence
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://smart_farm:smart_farm_dev@postgres:5432/smart_farm?schema=public
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY}
      SOILGRIDS_API_URL: https://rest.isric.org/soilgrids/v2.0
    ports:
      - "8001:8001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 2G
        reservations:
          memory: 512M

  # Celery Worker for background tasks
  celery-worker:
    build:
      context: ../intelligence
      dockerfile: Dockerfile
    container_name: smart-farm-celery-worker
    command: celery -A src.workers.celery_app worker --loglevel=info --concurrency=4
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://smart_farm:smart_farm_dev@postgres:5432/smart_farm?schema=public
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      OPENWEATHER_API_KEY: ${OPENWEATHER_API_KEY}
      WEATHERAPI_KEY: ${WEATHERAPI_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      intelligence:
        condition: service_started
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 256M

  # Celery Beat for periodic tasks
  celery-beat:
    build:
      context: ../intelligence
      dockerfile: Dockerfile
    container_name: smart-farm-celery-beat
    command: celery -A src.workers.celery_app beat --loglevel=info --scheduler celery.beat.PersistentScheduler
    environment:
      PYTHONUNBUFFERED: 1
      DATABASE_URL: postgresql://smart_farm:smart_farm_dev@postgres:5432/smart_farm?schema=public
      REDIS_URL: redis://redis:6379
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 64M

  # Flower for Celery monitoring
  flower:
    build:
      context: ../intelligence
      dockerfile: Dockerfile
    container_name: smart-farm-flower
    command: celery -A src.workers.celery_app flower --port=5555 --basic_auth=admin:${FLOWER_PASSWORD:-admin123}
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # Frontend (Next.js)
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smart-farm-frontend
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_BACKEND_URL: http://backend:3001
      NEXT_PUBLIC_INTELLIGENCE_URL: http://intelligence:8001
      NEXT_PUBLIC_MAPBOX_TOKEN: ${MAPBOX_TOKEN}
    ports:
      - "3000:3000"
    depends_on:
      - backend
      - intelligence
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 128M

  # NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: smart-farm-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - ./certbot/www:/var/www/certbot:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

  # Certbot for Let's Encrypt SSL
  certbot:
    image: certbot/certbot:latest
    container_name: smart-farm-certbot
    volumes:
      - ./ssl:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done'"

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  default:
    name: smart-farm-network
    driver: bridge