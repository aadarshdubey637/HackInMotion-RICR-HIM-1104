{
  "name": "@smart-farm/intelligence",
  "version": "1.0.0",
  "description": "Smart Farm DSS Intelligence Services - ML, Optimization, Recommendations",
  "main": "dist/index.js",
  "types": "dist/index.d.ts",
  "scripts": {
    "dev": "uvicorn src.main:app --reload --port 8001",
    "build": "python -m compileall src",
    "start": "uvicorn src.main:app --host 0.0.0.0 --port 8001",
    "lint": "ruff check src",
    "format": "ruff format src",
    "test": "pytest tests -v --cov=src",
    "test:watch": "ptw tests src",
    "train:crop-rec": "python -m src.models.crop_recommendation.train",
    "train:disease": "python -m src.models.disease_detection.train",
    "optimize:land": "python -m src.services.land_optimization.cli",
    "celery:worker": "celery -A src.workers.celery_app worker --loglevel=info",
    "celery:beat": "celery -A src.workers.celery_app beat --loglevel=info",
    "celery:flower": "celery -A src.workers.celery_app flower --port=5555"
  },
  "dependencies": {
    "fastapi": "^0.109.0",
    "uvicorn": "^0.27.0",
    "pydantic": "^2.5.0",
    "pydantic-settings": "^2.1.0",
    "sqlalchemy": "^2.0.0",
    "asyncpg": "^0.29.0",
    "redis": "^5.0.0",
    "celery": "^5.3.0",
    "flower": "^2.0.0",
    "numpy": "^1.26.0",
    "pandas": "^2.1.0",
    "scikit-learn": "^1.3.0",
    "scipy": "^1.11.0",
    "ortools": "^9.8.0",
    "geopandas": "^0.14.0",
    "shapely": "^2.0.0",
    "pyproj": "^3.6.0",
    "rasterio": "^1.3.0",
    "meteostat": "^1.6.0",
    "pvlib": "^0.10.0",
    "requests": "^2.31.0",
    "httpx": "^0.26.0",
    "python-dotenv": "^1.0.0",
    "loguru": "^0.7.0",
    "onnxruntime": "^1.18.0",
    "opencv-python-headless": "^4.8.0",
    "pillow": "^10.0.0",
    "joblib": "^1.3.0"
  },
  "devDependencies": {
    "pytest": "^7.4.0",
    "pytest-cov": "^4.1.0",
    "pytest-asyncio": "^0.23.0",
    "pytest-mock": "^3.12.0",
    "ruff": "^0.1.0",
    "mypy": "^1.8.0",
    "black": "^23.0.0",
    "isort": "^5.13.0",
    "ptw": "^2.0.0",
    "pre-commit": "^3.6.0"
  },
  "python": ">=3.11"
}