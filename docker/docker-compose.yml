# Smart Farm DSS — local container stack.
#
# Three services, matching what the application actually is: a MongoDB
# database, an Express/Prisma API, and a Next.js frontend.
#
# This file previously described a different system entirely — PostgreSQL with
# TimescaleDB, Redis, MinIO, a Python FastAPI service and three Celery
# processes. None of that exists in this repository, and the app has never used
# any of it.
#
#   Setup:  cp docker/.env.example docker/.env   (then edit the two secrets)
#   Run:    docker compose -f docker/docker-compose.yml up --build
#
# Every secret below is written `${VAR:?...}`, which makes Compose refuse to
# start with a clear message when the variable is unset. That is deliberate:
# a `${VAR:-default}` fallback is how a development password ends up running in
# production, because nothing ever fails to remind you it is there.

services:
  # ── Database ────────────────────────────────────────────────────────────
  #
  # A single-node replica set, not a standalone server. Prisma requires one for
  # `$transaction`, which email verification uses to spend the OTP and mark the
  # account verified as one unit. A standalone `mongod` rejects that with P2031.
  #
  # Replication plus authentication requires an internal-auth keyfile, so the
  # command generates one on first boot before handing over to the image's own
  # entrypoint.
  mongo:
    image: mongo:7
    container_name: smart-farm-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in docker/.env}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in docker/.env}
      MONGO_INITDB_DATABASE: smart_farm
    command: >
      bash -c '
        if [ ! -f /data/keyfile/mongo.key ]; then
          mkdir -p /data/keyfile
          openssl rand -base64 756 > /data/keyfile/mongo.key
          chmod 400 /data/keyfile/mongo.key
          chown mongodb:mongodb /data/keyfile/mongo.key
        fi
        exec docker-entrypoint.sh mongod --replSet rs0 --keyFile /data/keyfile/mongo.key --bind_ip_all
      '
    volumes:
      - mongo_data:/data/db
      - mongo_keyfile:/data/keyfile
    # Bound to the loopback interface only. Without the `127.0.0.1` prefix
    # Docker publishes on 0.0.0.0 and the database is reachable from the
    # network the laptop is on.
    ports:
      - "127.0.0.1:27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # One-shot: initiates the replica set, then exits. Without this the set has no
  # configuration and every write fails with NotYetInitialized.
  mongo-init:
    image: mongo:7
    container_name: smart-farm-mongo-init
    restart: "no"
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGO_ROOT_USER: ${MONGO_ROOT_USER:?set MONGO_ROOT_USER in docker/.env}
      MONGO_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:?set MONGO_ROOT_PASSWORD in docker/.env}
    # Idempotent: re-running the stack finds an initiated set and does nothing.
    command: >
      bash -c '
        mongosh --host mongo:27017
          -u "$$MONGO_ROOT_USER" -p "$$MONGO_ROOT_PASSWORD" --authenticationDatabase admin
          --quiet --eval "
            try {
              rs.status();
              print(\"replica set already initiated\");
            } catch (e) {
              rs.initiate({ _id: \"rs0\", members: [{ _id: 0, host: \"mongo:27017\" }] });
              print(\"replica set initiated\");
            }
          "
      '

  # ── API ─────────────────────────────────────────────────────────────────
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: smart-farm-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      # `replicaSet=rs0` matches the member host configured by mongo-init, so
      # the driver can discover the primary. `authSource=admin` is where the
      # root user created above lives.
      DATABASE_URL: mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo:27017/smart_farm?authSource=admin&replicaSet=rs0
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in docker/.env — at least 32 characters}
      JWT_EXPIRES_IN: 7d
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3001}
      UPLOAD_DIR: uploads
      # Optional. Unset means the feature degrades; see backend/.env.example.
      DATA_GOV_IN_API_KEY: ${DATA_GOV_IN_API_KEY:-}
      PLANT_ID_API_KEY: ${PLANT_ID_API_KEY:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    ports:
      - "3001:3001"
    volumes:
      # Crop photos are written to disk. Without this they vanish on every
      # rebuild, leaving health-log rows pointing at files that no longer exist.
      - backend_uploads:/app/uploads
    depends_on:
      mongo-init:
        condition: service_completed_successfully

  # ── Frontend ────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ../frontend
      dockerfile: Dockerfile
    container_name: smart-farm-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      # Read by the browser, so it must be an address the browser can reach —
      # `localhost`, not the `backend` service name.
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3001/api}
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo_data:
  mongo_keyfile:
  backend_uploads:

networks:
  default:
    name: smart-farm-network
